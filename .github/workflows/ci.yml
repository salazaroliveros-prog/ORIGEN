name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel obsolete validations for the same PR so only the latest source revision
# consumes emulator/build resources and provides the authoritative check result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Validate privacy-first Service Worker
        run: node scripts/generate-service-worker.js

      - name: Validate PWA manifest and local assets
        run: node scripts/pwa-manifest-validator.js

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Firebase emulator security tests
        # Keep the emulator version reproducible: firebase-tools 15.25+ bundles
        # Firestore Emulator v1.22.0, which has reported transaction/rules lock regressions.
        # 15.24.0 uses the v1.21.0 emulator while the upstream regression is unresolved.
        run: npm run test:firebase

      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIRESTORE_DATABASE_ID }}
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E against a fresh Firebase emulator
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          E2E_BASE_URL: 'http://127.0.0.1:3000'
          E2E_ADMIN_EMAIL: 'admin@origen.com'
          E2E_ADMIN_PASSWORD: 'admin123'
        run: npm run test:e2e
